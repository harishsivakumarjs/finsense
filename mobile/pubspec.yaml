name: finsense_mobile
description: FinSense Personal Finance — Mobile
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Firebase & Google Sign-In
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.4
  dio: ^5.4.3
  flutter_secure_storage: ^9.0.0
  fl_chart: ^0.67.0
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  connectivity_plus: ^6.0.3
  intl: ^0.19.0
  uuid: ^4.3.3
  flutter_animate: ^4.5.0
  flutter_dotenv: ^5.1.0
  share_plus: ^12.0.2
  path_provider: ^2.1.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
